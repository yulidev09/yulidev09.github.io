    <style>
        :root {
            --bg-base: #0d0e14;
            --bg-surface: #161822;
            --bg-card: #1e202e;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-accent: rgba(203, 166, 247, 0.4);
            --text-primary: #f4f4f8;
            --text-secondary: #9ca3af;
            --accent-main: #cba6f7;
            --accent-warm: #ff6b4a;
            --accent-green: #a6e3a1;
        }

        * {
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.6;
            margin: 0;
            overflow-x: hidden;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(13, 14, 20, 0.82);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 16px 24px;
        }

        .nav-inner {
            max-width: 1120px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 20px;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .brand-logo span {
            color: var(--accent-warm);
            font-size: 13px;
            vertical-align: super;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .nav-cta {
            background: var(--text-primary);
            color: var(--bg-base) !important;
            padding: 8px 18px;
            border-radius: 999px;
            font-weight: 600 !important;
            font-size: 13px !important;
            transition: transform 0.2s, background 0.2s !important;
        }

        .nav-cta:hover {
            background: var(--accent-main);
            transform: translateY(-1px);
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 30px 24px 80px;
        }

        .hero-editorial {
            position: relative;
            background: radial-gradient(circle at 75% 20%, rgba(255, 107, 74, 0.22), transparent 45%),
                        radial-gradient(circle at 20% 80%, rgba(203, 166, 247, 0.18), transparent 50%),
                        var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 28px;
            padding: 50px 45px 45px;
            margin-bottom: 30px;
            overflow: hidden;
        }
